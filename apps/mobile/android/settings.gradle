// pnpm symlinks must resolve to the same build identity in Gradle and Android Studio.
pluginManagement { includeBuild(file("../node_modules/@react-native/gradle-plugin").toPath().toRealPath().toString()) }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'app.voyavpn.mobile'
include ':app'
includeBuild(file('../node_modules/@react-native/gradle-plugin').toPath().toRealPath().toString())
