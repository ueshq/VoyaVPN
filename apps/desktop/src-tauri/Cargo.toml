[package]
name = "voyavpn"
description = "VoyaVPN desktop shell"
default-run = "voyavpn"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata]

[package.metadata.cargo-machete]
# Required by tauri::generate_context!, which cargo-machete cannot observe.
ignored = ["serde_json"]

[lib]
name = "voyavpn_lib"
crate-type = ["rlib"]
# This crate is Tauri shell glue; lib tests live in workspace crates.
# CI excludes this target because --all-targets still forces disabled harnesses.
test = false

[[bin]]
name = "voyavpn"
path = "src/main.rs"

[[bin]]
name = "voyavpn-tunnel-service"
path = "src/bin/voyavpn-tunnel-service.rs"

[features]
# The Mac App Store build (`pnpm build:mac:appstore`). It leaves out the
# self-updater, which App Review forbids; the store delivers updates. The
# updater crate stays a plain dependency so `capabilities/default.json` still
# resolves `updater:default` in every build.
mac-app-store = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "2.4.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.4"
# Updates ship raw `-setup.exe` / `.AppImage` (see scripts/release/commands/artifacts.mjs),
# so zip/tar/flate2 unpackers are dead weight in the binary. macOS still needs
# tar, which the target-platform feature pulls in automatically.
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["rustls-tls"] }
tauri-specta.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
voya-app.workspace = true
voya-contracts.workspace = true
voya-platform.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[lints]
workspace = true
