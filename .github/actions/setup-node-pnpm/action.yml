name: Setup Node and pnpm
description: Install pnpm, Node.js with a pnpm cache, and the workspace dependencies.
inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22"
  install:
    description: Whether to run `pnpm install --frozen-lockfile`.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # No `version`: pnpm/action-setup reads the root package.json
    # `packageManager` field, which is the one pnpm pin.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install workspace dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
