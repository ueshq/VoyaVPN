name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: "1.96.0"
  RUST_MSRV_VERSION: "1.94.1"
  CARGO_MACHETE_VERSION: "0.9.2"
  TAURI_DRIVER_VERSION: "2.0.6"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_DENY_VERSION: 0.19.9
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # cargo install rebuilds these audit tools from source on every run; the
      # cache turns the install steps into a no-op once the pinned version is
      # present. Swatinem/rust-cache deliberately does not cache ~/.cargo/bin.
      - name: Cache audit tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-audit-tools-${{ env.RUST_TOOLCHAIN_VERSION }}-deny-${{ env.CARGO_DENY_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      - name: Run cargo-deny
        run: cargo deny -L error --locked --all-features check advisories bans licenses sources

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

      - name: Run cargo-audit
        run: cargo audit

      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level high

  # verify:local's gates, split across three parallel jobs so the Rust compile
  # and the frontend build/Playwright run no longer wait on each other.
  # scripts/quality/verify-local.test.mjs fails unless the baseline-* jobs
  # together run every gate in scripts/quality/verify-local.mjs exactly once.
  baseline-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # check:i18n parses sources with the workspace's typescript.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: pnpm run check:architecture

      - name: Check lockfile single versions
        run: pnpm run check:lockfile

      - name: Check i18n locale drift
        run: pnpm run check:i18n

  baseline-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            pkg-config \
            libxdo-dev \
            wget

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # These gates are cargo and Node builtins only, but pnpm 11 installs the
      # workspace on the first `pnpm run` when node_modules is missing; doing it
      # here keeps that install frozen and out of the fmt step's timing.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cargo-machete binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-machete
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-machete-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_MACHETE_VERSION }}

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version "$CARGO_MACHETE_VERSION"

      # check:sing-box downloads and extracts the pinned sing-box archive when no
      # verified seed is staged. The key hashes the installer, which holds the
      # pinned version and digests, so a pin bump starts a fresh entry. A
      # restored seed is still re-verified before use (manifest against the
      # pinned archive digest, executable against the manifest) and re-staged on
      # any mismatch. Only sing_box/ is cached: its parent holds tracked files.
      - name: Cache sing-box core seed
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/src-tauri/resources/core-seeds/sing_box
          key: ${{ runner.os }}-${{ runner.arch }}-sing-box-seed-${{ hashFiles('scripts/core/sing-box-installer.mjs') }}

      - name: Check Rust formatting
        run: pnpm run check:rust:fmt

      - name: Lint Rust
        run: pnpm run check:rust:clippy

      - name: Check Rust dependency usage
        run: pnpm run check:rust:deps

      - name: Run Rust tests
        run: pnpm run check:rust:test

      - name: Validate generated configs with sing-box
        run: pnpm run check:sing-box

      - name: Check generated IPC binding drift
        run: pnpm run check:bindings

  baseline-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm run check:frontend:typecheck

      - name: Run frontend tests with coverage thresholds
        run: pnpm run check:frontend:coverage

      - name: Lint frontend
        run: pnpm run check:frontend:lint

      - name: Build frontend and enforce bundle budgets
        run: pnpm run check:frontend:bundle

      # Playwright pins its browser builds per release, so the resolved
      # @playwright/test version is the cache key.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @voya/desktop exec playwright --version)"
          version="${version#Version }"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @voya/desktop exec playwright install --with-deps chromium

      # The cache holds only the browser download; the system libraries
      # Chromium links against still have to be installed on every runner.
      - name: Install Chromium system dependencies
        if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: pnpm --filter @voya/desktop exec playwright install-deps chromium

      - name: Run frontend mock smoke tests
        run: pnpm run check:frontend:smoke:mock

      - name: Check dead code and dependency usage
        run: pnpm run check:dead-code

  desktop-smoke:
    name: Linux native desktop smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            pkg-config \
            libxdo-dev \
            webkit2gtk-driver \
            xvfb

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache tauri-driver binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-tauri-driver-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.TAURI_DRIVER_VERSION }}

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"

      # tauri:build stages the same pinned seed check:sing-box uses; see the
      # baseline-rust cache step for why a restored copy is safe to reuse.
      - name: Cache sing-box core seed
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/src-tauri/resources/core-seeds/sing_box
          key: ${{ runner.os }}-${{ runner.arch }}-sing-box-seed-${{ hashFiles('scripts/core/sing-box-installer.mjs') }}

      - name: Run real desktop smoke
        run: xvfb-run -a pnpm run check:desktop:smoke

  msrv:
    name: Rust MSRV 1.94.1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            pkg-config \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_MSRV_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets --locked

  platform-check:
    # Clippy, not cargo check: the strict workspace lints (unwrap_used,
    # undocumented_unsafe_blocks) are the only gate that ever sees the
    # #[cfg(windows)] / #[cfg(target_os = "macos")] code paths, which the Linux
    # baseline-rust job cannot lint. There is no Linux leg: baseline-rust
    # already runs the same workspace clippy with -D warnings on Linux, so one
    # here only re-linted identical code. Rust tests stay Linux-only on
    # purpose: no #[cfg(test)] module in the workspace is OS-gated, so running
    # them here would only re-run the same suite at triple the wall-clock cost.
    name: Rust lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Lint all Rust targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test macOS tunnel waiter without network changes
        if: ${{ runner.os == 'macOS' }}
        run: node scripts/native/macos/test-bridge.mjs
