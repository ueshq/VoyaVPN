name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# A superseded PR or push run is worth cancelling; a release's quality gate is
# not. This group is evaluated in the caller's context, so every channel's
# `quality-gate` call resolves to the same `Release-<ref>` group: cancelling
# would let a stable dispatch kill the beta release already running on that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: "1.96.0"
  RUST_MSRV_VERSION: "1.94.1"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          cache: "false"

      - uses: ./.github/actions/setup-node-pnpm

      # Only cargo-deny runs the RustSec check: it already covers advisories,
      # and cargo-audit's separate database/filters produced a second, drifting
      # opinion (deny.toml's ignore list is the single source of truth).
      - name: Install cargo-deny
        uses: taiki-e/install-action@6f976d36f95ad1b0a4bc57cf2ba09b1fab25dc10 # v2
        with:
          tool: cargo-deny@0.19.9

      - name: Run cargo-deny
        run: cargo deny -L error --locked --all-features check advisories bans licenses sources

      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level high

  # verify:local's gates, split across three parallel jobs so the Rust compile
  # and the frontend build/Playwright run no longer wait on each other.
  # scripts/quality/verify-local.test.mjs fails unless the baseline-* jobs
  # together run every gate in scripts/quality/verify-local.mjs exactly once.
  baseline-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Check architecture boundaries
        run: pnpm run check:architecture

      - name: Check lockfile single versions
        run: pnpm run check:lockfile

      - name: Check i18n locale drift
        run: pnpm run check:i18n

  baseline-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-linux-deps

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy, rustfmt

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install cargo-machete
        uses: taiki-e/install-action@6f976d36f95ad1b0a4bc57cf2ba09b1fab25dc10 # v2
        with:
          tool: cargo-machete@0.9.2

      # check:sing-box downloads and extracts the pinned sing-box archive when no
      # verified seed is staged. The key hashes the installer, which holds the
      # pinned version and digests, so a pin bump starts a fresh entry. A
      # restored seed is still re-verified before use (manifest against the
      # pinned archive digest, executable against the manifest) and re-staged on
      # any mismatch. Only sing_box/ is cached: its parent holds tracked files.
      - name: Cache sing-box core seed
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/src-tauri/resources/core-seeds/sing_box
          key: ${{ runner.os }}-${{ runner.arch }}-sing-box-seed-${{ hashFiles('scripts/core/sing-box-installer.mjs') }}

      - name: Check Rust formatting
        run: pnpm run check:rust:fmt

      - name: Lint Rust
        run: pnpm run check:rust:clippy

      - name: Check Rust dependency usage
        run: pnpm run check:rust:deps

      - name: Run Rust tests
        run: pnpm run check:rust:test

      - name: Validate generated configs with sing-box
        run: pnpm run check:sing-box

      - name: Check generated IPC binding drift
        run: pnpm run check:bindings

  baseline-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Typecheck frontend
        run: pnpm run check:frontend:typecheck

      - name: Run frontend tests with coverage thresholds
        run: pnpm run check:frontend:coverage

      - name: Lint frontend
        run: pnpm run check:frontend:lint

      - name: Build frontend and enforce bundle budgets
        run: pnpm run check:frontend:bundle

      # Playwright pins its browser builds per release, so the resolved
      # @playwright/test version is the cache key.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @voya/desktop exec playwright --version)"
          version="${version#Version }"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @voya/desktop exec playwright install --with-deps chromium

      # The cache holds only the browser download; the system libraries
      # Chromium links against still have to be installed on every runner.
      - name: Install Chromium system dependencies
        if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: pnpm --filter @voya/desktop exec playwright install-deps chromium

      - name: Run frontend mock smoke tests
        run: pnpm run check:frontend:smoke:mock

      - name: Check dead code and dependency usage
        run: pnpm run check:dead-code

  # The React Native app's own gates. They are deliberately outside
  # `verify:local`: Jest and a Metro bundle are a separate toolchain from the
  # Vitest/Playwright suite the `baseline-*` jobs split between them.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run mobile tests
        run: pnpm run check:mobile:test

      # Typecheck and lint resolve modules the Node way; the app is built by
      # Metro, whose resolver is configured separately. This is the only gate
      # that exercises it, and a workspace package that imports fine in an
      # editor can still fail to bundle for a device.
      - name: Bundle the mobile app for both platforms
        run: pnpm run check:mobile:bundle

  # The mobile host has to *cross-compile*, which the Linux baseline cannot
  # prove: `baseline-rust` builds for the host, and every blocker this job
  # exists to catch — a desktop-only crate that is not target-gated, a TLS
  # feature that needs a trust store a phone does not expose — only appears
  # when the target changes. The host-side tests themselves run in
  # `baseline-rust` with the rest of the workspace, so this job checks, it
  # does not test. iOS rides the platform-check macOS leg (same runner family,
  # already compiling for Apple targets) so one macos-15 machine covers both.
  mobile-rust-android:
    name: Mobile host cross-compile (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          cache-key: mobile-Android

      # `cargo-ndk` is what turns a Rust target triple into the NDK's clang and
      # sysroot; without it every Android link fails on a missing libc.
      - name: Install cargo-ndk
        uses: taiki-e/install-action@6f976d36f95ad1b0a4bc57cf2ba09b1fab25dc10 # v2
        with:
          tool: cargo-ndk@3.5.4

      - name: Check the mobile host for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 check -p voya-mobile-ffi --locked

  desktop-smoke:
    name: Linux native desktop smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-linux-deps
        with:
          extra-packages: webkit2gtk-driver xvfb

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install tauri-driver
        uses: taiki-e/install-action@6f976d36f95ad1b0a4bc57cf2ba09b1fab25dc10 # v2
        with:
          tool: tauri-driver@2.0.6

      # tauri:build stages the same pinned seed check:sing-box uses; see the
      # baseline-rust cache step for why a restored copy is safe to reuse.
      - name: Cache sing-box core seed
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/src-tauri/resources/core-seeds/sing_box
          key: ${{ runner.os }}-${{ runner.arch }}-sing-box-seed-${{ hashFiles('scripts/core/sing-box-installer.mjs') }}

      - name: Run real desktop smoke
        run: xvfb-run -a pnpm run check:desktop:smoke

  # MSRV is a dispatch/release gate only: clippy.toml's `msrv = "1.94"` already
  # makes `incompatible_msrv` reject newer std APIs on every PR, so re-checking
  # the whole workspace at 1.94.1 on each push bought no extra safety.
  msrv:
    name: Rust MSRV 1.94.1
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-linux-deps

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_MSRV_VERSION }}

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets --locked

  platform-check:
    # Clippy, not cargo check: the strict workspace lints (unwrap_used,
    # undocumented_unsafe_blocks) are the only gate that ever sees the
    # #[cfg(windows)] / #[cfg(target_os = "macos")] code paths, which the Linux
    # baseline-rust job cannot lint. There is no Linux leg: baseline-rust
    # already runs the same workspace clippy with -D warnings on Linux, so one
    # here only re-linted identical code. Rust tests stay Linux-only on
    # purpose: no #[cfg(test)] module in the workspace is OS-gated, so running
    # them here would only re-run the same suite at triple the wall-clock cost.
    # The macOS leg also cross-checks voya-mobile-ffi for iOS and parses the
    # app-side Swift, which used to need their own macos-15 job.
    name: Rust lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-ios,aarch64-apple-ios-sim' || '' }}

      - name: Lint all Rust targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check the mobile host for iOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo check -p voya-mobile-ffi --target "$target" --locked
          done

      # The app-side Swift has no host-side build — it reaches React,
      # NetworkExtension, Libbox and the uniffi bindings — so this checks the
      # one thing that can be checked without an Xcode project: that it parses.
      - name: Parse the iOS Swift sources
        if: ${{ runner.os == 'macOS' }}
        run: node scripts/quality/mobile-swift.mjs

      - name: Test macOS tunnel waiter without network changes
        if: ${{ runner.os == 'macOS' }}
        run: node scripts/native/macos/test-bridge.mjs
