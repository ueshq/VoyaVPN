name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel label used for artifact names and updater metadata.
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      build_profile:
        description: Use debug for credential-free validation; release is for prepared signing environments.
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      dry_run:
        description: Keep true for validation runs without real updater signatures or publication.
        required: true
        default: true
        type: boolean
      updater_metadata:
        description: Generate latest.json from signed updater artifacts or dry-run placeholders.
        required: true
        default: true
        type: boolean

# One release per channel at a time. A second dispatch queues behind the running
# one instead of cancelling it (a later dispatch replaces a queued run, never a
# running one): cancelling mid-publication could leave a channel with some
# artifacts or updater metadata uploaded and the rest missing. The
# group must differ from ci.yml's `<workflow>-<ref>` group, which the
# quality-gate call evaluates in this workflow's context; equal groups deadlock.
# Differing is not enough on its own: two channels dispatched on one ref share
# that inner group, so ci.yml turns cancellation off for a dispatched run.
concurrency:
  group: ${{ github.workflow }}-channel-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Reject stable dry runs
        if: ${{ inputs.channel == 'stable' && inputs.dry_run == true }}
        run: |
          echo "::error title=Invalid stable dispatch::Stable releases must use signed updater artifacts and cannot run with dry_run=true."
          exit 1

      - name: Reject stable debug builds
        if: ${{ inputs.channel == 'stable' && inputs.build_profile != 'release' }}
        run: |
          echo "::error title=Invalid stable dispatch::Stable releases must use build_profile=release."
          exit 1

      - name: Reject stable without updater metadata
        if: ${{ inputs.channel == 'stable' && inputs.updater_metadata != true }}
        run: |
          echo "::error title=Invalid stable dispatch::Stable releases must generate updater metadata evidence."
          exit 1

      - name: Validate non-dry-run updater signing secret
        if: ${{ inputs.dry_run == false }}
        env:
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH != '' }}
        run: |
          if [ "$HAS_TAURI_SIGNING_PRIVATE_KEY" != "true" ] && [ "$HAS_TAURI_SIGNING_PRIVATE_KEY_PATH" != "true" ]; then
            echo "::error title=Missing secret::TAURI_SIGNING_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY_PATH is required when dry_run is false."
            exit 1
          fi

      # This step only checks that signing material exists, so it receives
      # presence booleans instead of the secrets themselves: nothing here can
      # leak a certificate or password it never held. Host/placeholder/updater
      # key rules live in `pnpm release -- check-hosts` so the workflow does
      # not re-implement scripts/release/validation.mjs inline.
      - name: Validate stable release prerequisites
        if: ${{ inputs.channel == 'stable' && inputs.dry_run == false }}
        env:
          VOYAVPN_CDN_BASE_URL: ${{ vars.VOYAVPN_CDN_BASE_URL }}
          VOYAVPN_UPDATES_BASE_URL: ${{ vars.VOYAVPN_UPDATES_BASE_URL }}
          VOYAVPN_UPDATER_PUBLIC_KEY: ${{ vars.VOYAVPN_UPDATER_PUBLIC_KEY }}
          VOYAVPN_CORE_ASSETS_JSON: ${{ vars.VOYAVPN_CORE_ASSETS_JSON }}
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH != '' }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
          HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        run: |
          pnpm release -- check-hosts
          pnpm release -- updater-config

  package:
    name: Package ${{ matrix.release_target }}
    needs:
      - preflight
      - quality-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            release_target: darwin-x86_64
            rust_target: x86_64-apple-darwin
          - os: macos-15
            release_target: darwin-aarch64
            rust_target: aarch64-apple-darwin
          - os: windows-2025
            release_target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            release_target: windows-aarch64
            rust_target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04
            release_target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            release_target: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux Tauri dependencies
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/setup-linux-deps

      # This job deliberately has no Swatinem/rust-cache step: six release
      # runners saving release-profile target/ trees would evict the CI caches
      # from the shared 10 GB repository cache budget, and releases are
      # dispatch-only while CI runs on every pull request.
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          cache: "false"

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build Tauri package
        env:
          CI: "true"
          VOYAVPN_RELEASE_CHANNEL: ${{ inputs.channel }}
          VOYAVPN_UPDATES_BASE_URL: ${{ vars.VOYAVPN_UPDATES_BASE_URL }}
          VOYAVPN_UPDATER_PUBLIC_KEY: ${{ vars.VOYAVPN_UPDATER_PUBLIC_KEY }}
          RELEASE_PROFILE: ${{ inputs.build_profile }}
          TAURI_TARGET: ${{ matrix.rust_target }}
          # The updater signing key is needed on every runner; Apple signing and
          # notarization material only on macOS. WINDOWS_CERTIFICATE_* is not
          # passed at all: nothing on the `pnpm tauri:build` path reads it (only
          # scripts/native/windows/build-app.mjs does, which this workflow never
          # invokes), so exporting it here would hand a code-signing certificate
          # to six runners that cannot use it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          build_args=(--target "$TAURI_TARGET")
          if [ "$RELEASE_PROFILE" = "debug" ]; then
            build_args+=(--debug)
          fi

          pnpm tauri:build "${build_args[@]}"

          bundle_dir="target/${TAURI_TARGET}/${RELEASE_PROFILE}/bundle"
          if [ ! -d "$bundle_dir" ]; then
            bundle_dir="target/${RELEASE_PROFILE}/bundle"
          fi
          if [ ! -d "$bundle_dir" ]; then
            echo "::error title=Missing bundle directory::No Tauri bundle directory found for $TAURI_TARGET and profile $RELEASE_PROFILE."
            exit 1
          fi
          echo "BUNDLE_DIR=$bundle_dir" >> "$GITHUB_ENV"
          # Informational: sizes land in the job summary, nothing is gated yet.
          pnpm size:report --target "$TAURI_TARGET" --profile "$RELEASE_PROFILE" || true

      - name: Normalize artifacts and write checksums
        run: |
          pnpm release -- artifacts \
            --input "$BUNDLE_DIR" \
            --output "dist/release/${{ matrix.release_target }}" \
            --target "${{ matrix.release_target }}" \
            --channel "${{ inputs.channel }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voyavpn-${{ inputs.channel }}-${{ matrix.release_target }}-${{ inputs.build_profile }}
          path: dist/release/${{ matrix.release_target }}
          if-no-files-found: error

  cdn-staging-metadata:
    name: CDN Staging Metadata
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/downloaded-release-artifacts

      - name: Generate CDN release index
        env:
          CHANNEL: ${{ inputs.channel }}
          VOYAVPN_CDN_BASE_URL: ${{ vars.VOYAVPN_CDN_BASE_URL }}
        run: |
          base_url="${VOYAVPN_CDN_BASE_URL:-https://cdn.voyavpn.test/${CHANNEL}}"
          pnpm release -- index \
            --input dist/downloaded-release-artifacts \
            --out dist/cdn-staging/release-index.json \
            --channel "$CHANNEL" \
            --base-url "$base_url"

      - name: Upload CDN staging metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voyavpn-${{ inputs.channel }}-cdn-staging-metadata-${{ inputs.build_profile }}
          path: dist/cdn-staging
          if-no-files-found: error

  updater-metadata:
    name: Updater Metadata
    if: ${{ inputs.updater_metadata == true }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/downloaded-release-artifacts

      - name: Generate latest.json
        env:
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION: ${{ github.ref_name }}
          VOYAVPN_UPDATES_BASE_URL: ${{ vars.VOYAVPN_UPDATES_BASE_URL }}
        run: |
          base_url="${VOYAVPN_UPDATES_BASE_URL:-https://cdn.voyavpn.test/${CHANNEL}/updater}"
          placeholder_flag=""
          if [ "$DRY_RUN" = "true" ]; then
            placeholder_flag="--placeholder-signatures"
          fi

          pnpm release -- updater \
            --input dist/downloaded-release-artifacts \
            --out dist/updater/latest.json \
            --channel "$CHANNEL" \
            --base-url "$base_url" \
            $placeholder_flag

      - name: Upload updater metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voyavpn-${{ inputs.channel }}-updater-metadata-${{ inputs.build_profile }}
          path: dist/updater
          if-no-files-found: error

  core-staging-metadata:
    name: Core Staging Metadata
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Generate core asset metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          VOYAVPN_CDN_BASE_URL: ${{ vars.VOYAVPN_CDN_BASE_URL }}
          VOYAVPN_CORE_ASSETS_JSON: ${{ vars.VOYAVPN_CORE_ASSETS_JSON }}
        run: |
          mkdir -p dist/core-staging

          # Stable inputs were already required by preflight's `check-hosts`
          # (which rejects an empty or placeholder VOYAVPN_CDN_BASE_URL and
          # VOYAVPN_CORE_ASSETS_JSON), and the CLI refuses a stable run without
          # a base URL itself.
          if [ "$CHANNEL" = "stable" ]; then
            printf '%s\n' "$VOYAVPN_CORE_ASSETS_JSON" > dist/core-staging/source-core-assets.json
          else
            cp tests/fixtures/release/core-assets.json dist/core-staging/source-core-assets.json
          fi

          base_url="${VOYAVPN_CDN_BASE_URL:-https://cdn.voyavpn.test/${CHANNEL}}"
          pnpm release -- core-assets \
            --fixture dist/core-staging/source-core-assets.json \
            --out dist/core-staging/core-assets.json \
            --channel "$CHANNEL" \
            --base-url "$base_url"

      - name: Upload core staging metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voyavpn-${{ inputs.channel }}-core-staging-metadata-${{ inputs.build_profile }}
          path: dist/core-staging
          if-no-files-found: error

  final-stable-readiness:
    name: Final Stable Readiness
    if: ${{ inputs.channel == 'stable' && inputs.dry_run == false }}
    needs:
      - package
      - cdn-staging-metadata
      - updater-metadata
      - core-staging-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-node-pnpm

      # Pattern downloads instead of nine named steps. Each artifact still
      # lands in its own `voyavpn-<channel>-<target>-<profile>/` directory, and
      # readiness's artifact-manifest walk is recursive, so the package root can
      # be the download parent.
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: voyavpn-${{ inputs.channel }}-darwin-*-${{ inputs.build_profile }}
          path: dist/final-readiness/packages

      - name: Download package artifacts (Windows and Linux)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: |
            voyavpn-${{ inputs.channel }}-windows-*-${{ inputs.build_profile }}
            voyavpn-${{ inputs.channel }}-linux-*-${{ inputs.build_profile }}
          path: dist/final-readiness/packages

      - name: Download release metadata artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: voyavpn-${{ inputs.channel }}-*-metadata-${{ inputs.build_profile }}
          path: dist/final-readiness/metadata

      - name: Validate final stable readiness
        env:
          VOYAVPN_CDN_BASE_URL: ${{ vars.VOYAVPN_CDN_BASE_URL }}
          VOYAVPN_UPDATES_BASE_URL: ${{ vars.VOYAVPN_UPDATES_BASE_URL }}
          VOYAVPN_UPDATER_PUBLIC_KEY: ${{ vars.VOYAVPN_UPDATER_PUBLIC_KEY }}
          # Readiness only asserts that signing inputs exist, and it parses
          # downloaded release metadata while it does so; it gets presence
          # booleans rather than the signing material itself.
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH != '' }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
          HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        run: |
          # Each metadata artifact extracts under its artifact name; readiness
          # wants the payload files themselves.
          for dir in dist/final-readiness/metadata/voyavpn-${{ inputs.channel }}-*-metadata-${{ inputs.build_profile }}; do
            name="$(basename "$dir")"
            case "$name" in
              *-cdn-staging-metadata-*) dest=dist/final-readiness/cdn-staging-metadata ;;
              *-updater-metadata-*) dest=dist/final-readiness/updater-metadata ;;
              *-core-staging-metadata-*) dest=dist/final-readiness/core-staging-metadata ;;
              *) echo "unexpected metadata artifact: $name" >&2; exit 1 ;;
            esac
            mkdir -p "$dest"
            cp -R "$dir"/. "$dest"/
          done

          pnpm release -- readiness \
            --mode stable \
            --cdn-base-url "$VOYAVPN_CDN_BASE_URL" \
            --updates-base-url "$VOYAVPN_UPDATES_BASE_URL" \
            --release-artifacts dist/final-readiness/packages \
            --updater-artifacts dist/final-readiness/packages \
            --core-assets dist/final-readiness/core-staging-metadata/source-core-assets.json \
            --release-index dist/final-readiness/cdn-staging-metadata/release-index.json \
            --updater-metadata dist/final-readiness/updater-metadata/latest.json \
            --core-manifest dist/final-readiness/core-staging-metadata/core-assets.json \
            --tauri-config dist/final-readiness/packages/voyavpn-${{ inputs.channel }}-darwin-x86_64-${{ inputs.build_profile }}/stable-updater-config.json \
            --work-dir dist/final-readiness/readiness-output

      - name: Upload final readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voyavpn-${{ inputs.channel }}-final-readiness-${{ inputs.build_profile }}
          path: dist/final-readiness/readiness-output
          if-no-files-found: error
