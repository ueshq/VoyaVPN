packages:
  - "apps/*"
  - "packages/*"
catalog:
  '@tanstack/react-query': ^5.100.14
  react: ^19.2.6
  react-dom: ^19.2.6
  '@types/node': ^25.9.1
  zod: ^4.4.3
  '@types/react': ^19.2.15
  '@types/react-dom': ^19.2.3
  typescript: ^6.0.3
  tailwindcss: ^4.3.0
  tailwind-merge: ^3.6.0
  lucide-react: ^1.17.0
  vitest: 5.0.3
  jsdom: ^29.1.1
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  '@vitest/coverage-v8': 5.0.3
# Radix keeps portal/focus/dismiss state in module-level context, so two copies
# of a primitive break Escape-to-close across the boundary. The exact pins in
# packages/ui cover the direct deps; these cover the transitive ones.
# `pnpm run check:lockfile` fails if a second version ever reappears.
overrides:
  '@radix-ui/react-slot': 1.3.3
  # Vite+ ships its own Vite build and pins one Vitest; plugins and jest-dom
  # that ask for `vite` or `vitest` must get exactly those, never a second copy.
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  '@swc/core': true
optimisticRepeatInstall: false
# The uniwind patch handles React Native 0.87's `auto` colour scheme and the
# setColorScheme ordering around it; drop it when a uniwind release above
# 1.12.0 handles `auto`.
patchedDependencies:
  # RN 0.87's prebuilt iOS framework requires the qualified React header import.
  react-native-bottom-tabs@1.4.0: patches/react-native-bottom-tabs@1.4.0.patch
  uniwind@1.12.0: patches/uniwind@1.12.0.patch
# The Vite+ core reports its own version (1.x), which the Vite plugins' `vite`
# peer ranges (^8) do not name although it is Vite 8 underneath.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# pnpm holds back releases younger than a day. Vite+ is pinned exactly, so
# exempt that one release; drop these lines once it has aged past the window.
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.1.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.1.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.1.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.1.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0'
  - vite-plus@1.1.0
