[package]
name = "voya-app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
futures-util = "0.3"
base64 = "0.22"
getrandom = "0.4"
regex = "1.12"
rqrr = { version = "=0.10.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tracing.workspace = true
uuid = { version = "1.23", features = ["v4"] }
voya-core.workspace = true
voya-contracts.workspace = true
voya-db.workspace = true
voya-net.workspace = true
voya-platform.workspace = true
# Self-hosted node REALITY keypairs; the private key never leaves the backend.
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }

[dev-dependencies]
criterion.workspace = true
tokio = { workspace = true, features = ["test-util"] }
sqlx.workspace = true
voya-net = { workspace = true, features = ["test-utils"] }
voya-platform = { workspace = true, features = ["test-support"] }

[[bench]]
name = "subscription_import"
harness = false

[lints]
workspace = true
