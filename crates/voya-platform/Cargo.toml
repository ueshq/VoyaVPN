[package]
name = "voya-platform"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
test-support = []

[dependencies]
# Text only: the default `image-data` feature was the one thing pulling the
# TIFF and JPEG decoders into the app, for a clipboard read that never asks
# for an image.
arboard = { version = "3.6", default-features = false }
libc.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
voya-core.workspace = true
xcap = "=0.9.8"
sys-locale = "0.3"
if-addrs = "0.15"
base64 = "0.22"

[build-dependencies]
cc = "1.2"

[lints]
workspace = true
