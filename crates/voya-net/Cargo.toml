[package]
name = "voya-net"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
test-utils = []

[dependencies]
base64 = "0.22"
futures-util = "0.3"
percent-encoding = "2.3"
# `rustls-tls-native-roots` keeps the download stack on the same trust policy as
# `certificates::client_config`: bundled webpki roots plus the OS trust store.
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "rustls-tls-native-roots", "socks"] }
rustls = "0.23"
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "time"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true
voya-contracts.workspace = true
voya-core.workspace = true
webpki-roots = "1.0"

[lints]
workspace = true
