[package]
name = "voya-net"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
test-utils = []

[dependencies]
futures-util = "0.3"
igd-next = { version = "0.17", default-features = false, features = ["aio_tokio"] }
percent-encoding = "2.3"
# `rustls-tls-native-roots` trusts the bundled webpki roots plus the OS trust store.
# Clients are built through `tls_roots::client_builder`, which reads the OS store
# once per process; `rustls` and `rustls-native-certs` are the versions reqwest
# already uses. `gzip` lets subscription servers compress their base64 bodies;
# the response limits count decoded bytes, so it cannot slip past them.
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls-tls", "rustls-tls-native-roots", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "time"] }
# Only sing-box's loopback Clash API is dialled, always over plain `ws://`, so
# the websocket client carries no TLS of its own (and no second root store).
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
tracing.workspace = true
voya-core.workspace = true

[dev-dependencies]
base64 = "0.22"

[lints]
workspace = true
