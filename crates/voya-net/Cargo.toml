[package]
name = "voya-net"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
test-utils = []

[dependencies]
futures-util = "0.3"
igd-next = { version = "0.17", default-features = false, features = ["aio_tokio"] }
percent-encoding = "2.3"
# `rustls-tls-native-roots` trusts the bundled webpki roots plus the OS trust store.
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "rustls-tls-native-roots", "socks"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true
voya-core.workspace = true

[dev-dependencies]
base64 = "0.22"

[lints]
workspace = true
