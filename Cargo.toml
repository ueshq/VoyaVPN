[workspace]
members = [
    "crates/voya-app",
    "crates/voya-contracts",
    "crates/voya-core",
    "crates/voya-db",
    "crates/voya-net",
    "crates/voya-platform",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/voyavpn/voyavpn"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
# Benchmarks only (`pnpm bench:rust`); no plots or rayon, so the test gate that
# builds bench targets stays light.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-build = "2.6.2"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
voya-app = { path = "crates/voya-app" }
voya-contracts = { path = "crates/voya-contracts" }
voya-core = { path = "crates/voya-core" }
voya-db = { path = "crates/voya-db" }
voya-net = { path = "crates/voya-net" }
voya-platform = { path = "crates/voya-platform" }

# Shipped binaries are the GUI shell and its helpers; the proxy hot path runs
# inside sing-box, so size wins over speed here. Measured on macOS arm64 (the
# `voyavpn` binary): default profile 34.6 MB, opt 3 + fat LTO + strip 19.7 MB,
# "s" 15.3 MB, "z" 11.7 MB. The CPU-bound work left in-process (QR decoding,
# SQLite, config generation) is occasional and small.
# `panic` stays at the default `unwind` on purpose: a panicking Tokio task must
# not take the process down before shutdown restores the system proxy/TUN.
# Dependencies keep line tables (backtraces still name file and line) but no
# full debuginfo: nobody steps through a dependency's locals, and the full
# tables were most of every dev/test build's size and of CI's Rust cache.
# Workspace crates keep full debuginfo.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
rust_2018_idioms = "warn"
# Edition 2021 leaves this allow-by-default, so an `unsafe fn` body may perform
# unsafe operations with no inner block and therefore no SAFETY comment to
# review. Warning here keeps the FFI code auditable and matches edition 2024.
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# `unwrap_used` alone only renamed the panics: `expect` and `panic!` are the
# same crash with a message. Tests may use all three (see clippy.toml).
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"
